<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>위젯 미리보기</title>
<style>body{margin:0;background:#f4f5f7}iframe{border:0;width:100%;display:block;background:#fff}</style>
<iframe id="f" height="560"></iframe>
<script>
// 사용법: preview.html?w=stock&name=루나전자&price=71200  (LT 는 가짜다)
const q=new URLSearchParams(location.search), w=q.get('w')||'stock', vars={};
q.forEach((v,k)=>{if(k!='w')vars[k]=v});
const mock=`<script>window.LT={vars:${JSON.stringify(vars)},
sendToAI:t=>{console.log('sendToAI',t);return Promise.resolve({ok:true})},
setValue:(k,v)=>{console.log('setValue',k,v);return Promise.resolve({ok:true})},
getValues:()=>Promise.resolve({}),resize:h=>parent.document.getElementById('f').height=h,autosize:()=>{},
hidden:()=>({})};<\/script>`;
fetch(`../widgets/${w}/index.html`).then(r=>r.text()).then(t=>{f.srcdoc=mock+t});
</script>
