<!-- 주식 차트 위젯 (모바일). 태그: <lunatalk_asset id="stock" name="루나전자" code="LUNA" price="71200" prev="70500" seed="a1" /> -->
<style>
*{box-sizing:border-box;margin:0}
body{background:#fff;color:#191f28;font:14px/1.4 -apple-system,"Pretendard","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
#w{max-width:480px;margin:0 auto;padding:12px 14px 14px;user-select:none}
.top{display:flex;align-items:baseline;gap:8px}
.name{font-size:18px;font-weight:700}
.sub{font-size:11px;color:#8b95a1}
.px{display:flex;align-items:baseline;gap:8px;margin:8px 0 10px;flex-wrap:wrap}
.price{font-size:28px;font-weight:700;letter-spacing:-.5px}
.chg{font-size:14px}
.up{color:#f04452}.dn{color:#3182f6}
.per{display:flex;border:1px solid #d1d6db;border-radius:6px;overflow:hidden;width:max-content}
.per button{border:0;background:#fff;padding:6px 16px;font:inherit;color:#6b7684;cursor:pointer;border-right:1px solid #e5e8eb}
.per button:last-child{border:0}
.per button.on{background:#191f28;color:#fff;font-weight:700}
.info{font-size:11px;color:#6b7684;min-height:32px;margin-top:8px}
.info b{font-weight:600}
canvas{display:block;width:100%;touch-action:pan-y}
.ord{display:flex;gap:8px;margin-top:12px}
.ord button{flex:1;border:0;border-radius:8px;padding:12px;font:700 15px inherit;font-family:inherit;color:#fff;cursor:pointer}
.ord .buy{background:#f04452}.ord .sell{background:#3182f6}
.ord button:active{opacity:.8}
.msg{font-size:12px;color:#8b95a1;margin-top:6px;min-height:16px;text-align:center}
</style>
<div id="w">
  <div class="top"><span class="name" id="nm"></span><span class="sub" id="sb"></span></div>
  <div class="px"><span class="price" id="pr"></span><span class="chg" id="ch"></span></div>
  <div class="per" id="per"><button data-n="1" class="on">일</button><button data-n="5">주</button><button data-n="21">월</button></div>
  <div class="info" id="info"></div>
  <canvas id="cv"></canvas>
  <div class="ord"><button class="buy" id="buy">매수</button><button class="sell" id="sell">매도</button></div>
  <div class="msg" id="msg"></div>
</div>
<script>
const V=(typeof LT!=='undefined'&&LT.vars)||{};
const name=V.name||'루나전자', code=V.code||'LUNA', cur=V.cur||'원', market=V.market||'루나거래소';
const price=+V.price||71200, prev=+V.prev||Math.round(price*.99);
const UP='#f04452', DN='#3182f6', fmt=n=>Math.round(n).toLocaleString('ko-KR');

// 같은 seed 면 항상 같은 차트가 나온다
let s=[...(V.seed||name)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const rnd=()=>(s=(s+0x6D2B79F5)>>>0,((t=>(t=Math.imul(t^t>>>15,t|1),t^=t+Math.imul(t^t>>>7,t|61),((t^t>>>14)>>>0)/4294967296))(s)));
const N=500, D=[]; let c=100, trend=0;
for(let i=0;i<N;i++){
  trend=trend*.97+(rnd()-.5)*.004;
  const o=c*(1+(rnd()-.5)*.012), cl=o*(1+(rnd()-.5)*.045+trend);
  D.push({o,c:cl,h:Math.max(o,cl)*(1+rnd()*.015),l:Math.min(o,cl)*(1-rnd()*.015),v:(.4+rnd()*1.2)*(1+Math.abs(cl-o)/o*30)*1e5});
  c=cl;
}
// 끝에서 두 번째 종가 = prev, 마지막 종가 = price 로 맞춘다
const k=prev/D[N-2].c; D.forEach(d=>{d.o*=k;d.c*=k;d.h*=k;d.l*=k});
const L=D[N-1]; L.o=prev; L.c=price; L.h=Math.max(L.h,price,prev); L.l=Math.min(L.l,price,prev);

const DAY0=new Date(); const date=i=>{const d=new Date(DAY0);d.setDate(d.getDate()-(N-1-i)*1.4);return (d.getMonth()+1)+'.'+String(d.getDate()).padStart(2,'0')};
const group=n=>{ if(n==1) return D; const r=[]; for(let i=N%n;i<N;i+=n){const g=D.slice(i,i+n);
  r.push({o:g[0].o,c:g[g.length-1].c,h:Math.max(...g.map(x=>x.h)),l:Math.min(...g.map(x=>x.l)),v:g.reduce((a,x)=>a+x.v,0),i:i+g.length-1});} return r};
const ma=(a,n)=>a.map((_,i)=>i<n-1?null:a.slice(i-n+1,i+1).reduce((x,y)=>x+y.c,0)/n);

let per=1, hover=-1, view=[];
const cv=document.getElementById('cv'), g=cv.getContext('2d');
const H=330, PH=230, VH=62, R=58; // 전체 높이, 가격 영역, 거래량 영역, 오른쪽 눈금 폭

function draw(){
  const W=cv.clientWidth, dpr=window.devicePixelRatio||1;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+'px'; g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,W,H); g.font='11px sans-serif';
  const all=group(per), cnt=Math.min(all.length,60), a=all.slice(-cnt); view=a;
  const m5=ma(all,5).slice(-cnt), m20=ma(all,20).slice(-cnt);
  const hi=Math.max(...a.map(d=>d.h)), lo=Math.min(...a.map(d=>d.l)), pad=(hi-lo)*.08;
  const top=hi+pad, bot=lo-pad, cw=(W-R)/cnt, y=p=>10+(top-p)/(top-bot)*(PH-20);
  // 가격 눈금
  g.strokeStyle='#f2f4f6'; g.fillStyle='#8b95a1'; g.textAlign='right'; g.lineWidth=1;
  for(let i=0;i<=4;i++){const p=bot+(top-bot)*i/4, yy=y(p); g.beginPath(); g.moveTo(0,yy); g.lineTo(W-R,yy); g.stroke(); g.fillText(fmt(p),W-4,yy+4);}
  // 캔들
  a.forEach((d,i)=>{const x=i*cw+cw/2, col=d.c>=d.o?UP:DN; g.strokeStyle=g.fillStyle=col;
    g.beginPath(); g.moveTo(x,y(d.h)); g.lineTo(x,y(d.l)); g.stroke();
    const t=y(Math.max(d.o,d.c)), b=y(Math.min(d.o,d.c)); g.fillRect(x-cw*.35,t,cw*.7,Math.max(1,b-t));});
  // 이동평균
  [[m5,'#ff9500'],[m20,'#34c759']].forEach(([m,col])=>{g.strokeStyle=col; g.beginPath(); let on=0;
    m.forEach((v,i)=>{if(v==null)return; const x=i*cw+cw/2; on?g.lineTo(x,y(v)):g.moveTo(x,y(v)); on=1;}); g.stroke();});
  // 현재가 표시
  const cp=a[a.length-1].c, cy=y(cp), up=cp>=prev;
  g.setLineDash([3,3]); g.strokeStyle=up?UP:DN; g.beginPath(); g.moveTo(0,cy); g.lineTo(W-R,cy); g.stroke(); g.setLineDash([]);
  g.fillStyle=up?UP:DN; g.fillRect(W-R+2,cy-9,R-2,18); g.fillStyle='#fff'; g.fillText(fmt(cp),W-4,cy+4);
  // 거래량
  const vy=PH+8, vmax=Math.max(...a.map(d=>d.v));
  g.strokeStyle='#e5e8eb'; g.beginPath(); g.moveTo(0,PH); g.lineTo(W,PH); g.stroke();
  a.forEach((d,i)=>{g.fillStyle=d.c>=d.o?UP:DN; const h=d.v/vmax*(VH-8); g.fillRect(i*cw+cw*.15,vy+VH-8-h,cw*.7,h);});
  g.fillStyle='#8b95a1'; g.textAlign='right'; g.fillText((vmax/1e3).toFixed(0)+'K',W-4,vy+8);
  // 날짜
  g.textAlign='center'; g.fillStyle='#8b95a1';
  [0,.25,.5,.75].forEach(f=>{const i=Math.floor(f*(cnt-1)); const di=per==1?N-cnt+i:(a[i].i); g.fillText(date(di),i*cw+cw/2+(f==0?16:0),H-6);});
  // 십자선
  if(hover>=0&&hover<cnt){const x=hover*cw+cw/2; g.strokeStyle='#8b95a1'; g.setLineDash([2,3]); g.beginPath(); g.moveTo(x,0); g.lineTo(x,PH+VH); g.stroke(); g.setLineDash([]);}
  info();
}
function info(){
  const d=view[hover>=0?hover:view.length-1]; if(!d) return;
  const c=d.c>=d.o?'up':'dn', p=hover>0?view[hover-1].c:(view.length>1?view[view.length-2].c:prev);
  document.getElementById('info').innerHTML=
    `<b>시</b> <span class="${c}">${fmt(d.o)}</span> &nbsp;<b>고</b> <span class="up">${fmt(d.h)}</span> &nbsp;<b>저</b> <span class="dn">${fmt(d.l)}</span> &nbsp;<b>종</b> <span class="${c}">${fmt(d.c)}</span><br>`+
    `<b>거래량</b> ${fmt(d.v)} &nbsp;<span style="color:#ff9500">MA5</span> <span style="color:#34c759">MA20</span>`;
}
function head(){
  const diff=price-prev, pct=diff/prev*100, c=diff>=0?'up':'dn', ar=diff>=0?'▲':'▼';
  document.getElementById('nm').textContent=name;
  document.getElementById('sb').textContent=`${code} | ${market} | ${cur}`;
  const pr=document.getElementById('pr'); pr.textContent=fmt(price); pr.className='price '+c;
  const ch=document.getElementById('ch'); ch.className='chg '+c; ch.textContent=`${ar} ${fmt(Math.abs(diff))}  ${Math.abs(pct).toFixed(2)}%`;
}
const at=e=>{const r=cv.getBoundingClientRect(); return Math.floor((e.clientX-r.left)/((r.width-R)/view.length))};
cv.addEventListener('pointerdown',e=>{hover=at(e);draw()});
cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType=='mouse'){hover=at(e);draw()}});
cv.addEventListener('pointerleave',()=>{hover=-1;draw()});
document.getElementById('per').onclick=e=>{const b=e.target.closest('button'); if(!b)return;
  per=+b.dataset.n; hover=-1; [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x==b)); draw()};

// 주문은 버튼을 눌렀을 때만 보낸다 (한 턴 요금이 든다)
const send=(kind,btn)=>{
  if(typeof LT==='undefined'){msg.textContent='미리보기: 전송 안 됨';return}
  btn.disabled=true;
  LT.sendToAI(`[주문] ${name}(${code}) ${kind} — 현재가 ${fmt(price)}${cur}`).then(r=>{
    btn.disabled=false; msg.textContent=r&&r.ok?'':'전송하지 못했어요'});
};
const msg=document.getElementById('msg');
buy.onclick=()=>send('매수',buy); sell.onclick=()=>send('매도',sell);

head(); draw(); addEventListener('resize',draw);
if(typeof LT!=='undefined'&&LT.autosize) LT.autosize(true);
</script>
